name: Main

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Publish adds id-token for OIDC registry auth.
permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: List matrix cells
        id: list
        run: echo "list=$(bundle exec appraisal list | jq -R -c -s 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run check
        run: bundle exec rake check
      - name: Run build
        run: bundle exec rake build
      - name: Verify package artifacts
        run: bin/verify-package

  validate:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
        appraisal: ${{ fromJSON(needs.matrix.outputs.list) }}
        exclude:
          # Rails 8, Sidekiq 8, and resque-retry 1.9 (resque 3) require Ruby >= 3.2
          - ruby-version: "3.1"
            appraisal: rails_8
          - ruby-version: "3.1"
            appraisal: sidekiq_8
          - ruby-version: "3.1"
            appraisal: resque_3
          - ruby-version: "3.1"
            appraisal: solid_queue_1
          - ruby-version: "3.1"
            appraisal: good_job_3
          - ruby-version: "3.1"
            appraisal: good_job_4
          - ruby-version: "3.1"
            appraisal: que_1
          - ruby-version: "3.1"
            appraisal: que_2
          - ruby-version: "3.1"
            appraisal: queue_classic_4
          - ruby-version: "3.1"
            appraisal: delayed_job_active_record_4
          - ruby-version: "3.1"
            appraisal: delayed_job_mongoid_3
    name: ${{ matrix.appraisal }} (Ruby ${{ matrix.ruby-version }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Appraisal setup
        run: bundle install
        env:
          BUNDLE_GEMFILE: gemfiles/${{ matrix.appraisal }}.gemfile
      - name: Run tests
        run: bundle exec rake test:${{ matrix.appraisal }}

  publish:
    needs: [check, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Bind OIDC to this environment. Create "release" in each repo Settings → Environments
    # and set the same name on the registry trusted publisher.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(ruby -e 'require_relative "lib/hirefire/version"; print HireFire::VERSION')"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match package version $expected"
            exit 1
          fi
      - name: Verify changelog has a section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! grep -qE "^## \[${version}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a section: ## [${version}] - YYYY-MM-DD"
            exit 1
          fi
      - name: Run build
        run: bundle exec rake build
      - name: Verify package artifacts
        run: bin/verify-package
      - name: Publish package
        uses: rubygems/release-gem@v1
