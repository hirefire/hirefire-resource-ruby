name: Main

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}

jobs:
  appraisals:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: List appraisals
        id: list
        run: echo "list=$(bundle exec appraisal list | jq -R -c -s 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  validate:
    needs: appraisals
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      redis:
        image: redis:latest
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:latest
        ports:
          - 5672:5672
    strategy:
      matrix:
        ruby-version:
          - 3.2
          - 3.3
          - 3.4
          - 4.0
        appraisal: ${{ fromJson(needs.appraisals.outputs.list) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Fix gem directory permissions
        run: chmod +t "$(ruby -e 'puts Gem.dir')/gems"
      - name: Appraisal setup
        run: bundle install
        env:
          BUNDLE_GEMFILE: gemfiles/${{ matrix.appraisal }}.gemfile
      - name: Run standard
        run: bundle exec rake standard
      - name: Run tests
        run: bundle exec rake test:${{ matrix.appraisal }}
      - name: Run build
        run: bundle exec rake build

  publish:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0
          bundler-cache: true
      - name: Release Gem
        uses: rubygems/release-gem@v1
